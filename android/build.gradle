// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.0'
        classpath 'com.google.gms:google-services:4.4.4'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        google()
        mavenCentral()
    }
    // scripts/android.mjs points this outside synced folders (OneDrive locks files
    // mid-build). Unset (e.g. Android Studio), Gradle uses the normal build/ dirs.
    def externalBuildRoot = System.getenv('LAKSHYA_ANDROID_BUILD_DIR')
    if (externalBuildRoot) {
        layout.buildDirectory.set(new File(externalBuildRoot, project.path == ':' ? '_root' : project.path.substring(1).replace(':', '_')))
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}

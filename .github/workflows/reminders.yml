# Fallback scheduler for when pg_cron is not used. GitHub's minimum interval is
# 5 minutes and runs are often delayed 5–15 minutes under load, so reminders
# may arrive late. Free for public repos; private repos get 2,000 min/month
# (each run bills ≥1 minute → every 10 min ≈ 4,300 min/month, too many;
# use */30 (≈1,440 min/month) for private repos, or prefer pg_cron).
# Scheduled workflows are disabled after 60 days without repository activity.
name: Dispatch reminders

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Call dispatcher
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$CRON_SECRET" ]; then echo "Secrets not configured; skipping."; exit 0; fi
          curl -fsS -X POST "$SUPABASE_URL/functions/v1/dispatch-reminders" \
            -H "content-type: application/json" -H "x-cron-secret: $CRON_SECRET" -d '{}' --max-time 60
